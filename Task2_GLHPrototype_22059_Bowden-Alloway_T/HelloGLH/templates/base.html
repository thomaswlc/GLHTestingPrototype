<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "Greenfield Local Hub" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>



<body>

    <header class="top-header">
        <div class="logo">
            <img src="{{ url_for('static', filename='GLHLogo.png') }}" alt="Logo">
        </div>

        <div class="header-title">
            <h1>Your community's trusted farmers market</h1>
        </div>

        <nav class="navbar">
            <div>
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('market') }}">Market</a>
                <a href="{{ url_for('products') }}">Products</a>
                <a href="{{ url_for('about') }}">About</a>
            </div>

            <div>
                <a href="{{ url_for('signin') }}">Login</a>
                <a href="{{ url_for('register') }}">Register</a>
            </div>
        </nav>
    </header>

        <main class="content">
            {% block content %}{% endblock %}
        </main>

        <footer class="footer">
            <p>© Greenfield Local Hub</p>
        </footer>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                let currentSlide = 0;
                const slides = document.querySelectorAll(".slide");

                if (slides.length === 0) return;

                function showNextSlide() {
                    slides[currentSlide].classList.remove("active");
                    currentSlide = (currentSlide + 1) % slides.length;
                    slides[currentSlide].classList.add("active");
                }

                setInterval(showNextSlide, 5000);
            });
        </script>

</body>


</html>
