<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>
<body>

    <!-- HEADER -->
    <header class="top-header">
        <div class="logo">
            <img src="{{ url_for('static', filename='GLHLogo.png') }}" alt="Logo">
        </div>

        <div class="header-title">
            <h1>Your community's trusted farmers market</h1>
        </div>

        <nav class="nav-menu">
            <ul>
                <!-- HOME BUTTON (icon placeholder) -->
                <li class="home-btn">
                    <a href="{{ url_for('home') }}">
                        <img src="{{ url_for('static', filename='HomeIcon.png') }}" alt="Home">
                    </a>
                </li>

                <li><a href="{{ url_for('market') }}">Markets</a></li>
                <li><a href="{{ url_for('products') }}">Products</a></li>
                <li><a href="{{ url_for('about') }}">About us</a></li>
                <li><a href="{{ url_for('signin') }}">Login/Register</a></li>
            </ul>
        </nav>
    </header>

    <!-- PAGE CONTENT GOES HERE -->
    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
